[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ampulheta"
version = "0.1.0"
description = "Quanto tempo esse processo ainda vai levar? Sobrevivência sobre dados do DataJud."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "pandas>=2.2",
  "pyarrow>=16",
  "lifelines>=0.29",
  "scikit-survival>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "jupyter", "matplotlib"]

[project.scripts]
ampulheta = "ampulheta.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
